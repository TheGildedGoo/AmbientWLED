name: Build Kodi repo

on:
  push:
    branches: [main]
    paths:
      - "script.service.ambientwled/**"
      - "script.module.ambientwled/**"
      - "plugin.program.ambientwled/**"
      - "repository.ambientwled/**"
      - "tools/build_repo.py"
      - ".github/workflows/kodi-repo.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Pack zips and index
        run: python3 tools/build_repo.py
      - name: Commit repo artifacts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add repo
          git diff --cached --quiet || git commit -m "chore: rebuild Kodi repository index"
          git push
